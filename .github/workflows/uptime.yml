name: Uptime

# A failed run is the alert: GitHub emails the repository owner.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Production answers
        run: |
          for url in https://firstpass-desk.vercel.app/ https://firstpass-desk.vercel.app/api/cds/health; do
            curl -fsS --retry 3 --retry-delay 20 --retry-all-errors -o /dev/null -w "%{http_code} %{time_total}s $url\n" "$url"
          done
