name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build application without production DB migration
        run: node scripts/with-app-env.mjs vite build
      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1
      - name: Audit local preview without customer data
        run: |
          set -euo pipefail
          npm run preview > preview-lhci.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/sitemap.xml > /dev/null; then ready=1; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then cat preview-lhci.log; exit 1; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat preview-lhci.log; exit 1; fi
          lhci collect --config=./lighthouserc.json
          lhci assert --config=./lighthouserc.json
          lhci upload --config=./lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firstpass-lighthouse
          path: lhci-reports/
          if-no-files-found: ignore
          retention-days: 7
