        - generic [ref=e329]:
          - paragraph [ref=e330]: Monograph
          - heading "Mavorixafor" [level=2] [ref=e331]
          - paragraph [ref=e332]: CXCR4 antagonist · Xolremdi
          - paragraph [ref=e333]: "CXCR4 antagonist for WHIM syndrome. Section 4: 'Use of XOLREMDI is contraindicated with drugs that are highly dependent on CYP2D6 for clearance.' Section 7.2: 'Mavorixafor is a CYP2D6 inhibitor.' The label gives no strong, moderate, or weak word, so that inhibitor role stays ungraded and is not scored. The same section says mavorixafor increases exposure of CYP2D6 substrates. Section 12.3: 'Dextromethorphan (CYP2D6 substrate) Cmax increased by 6-fold (CI 90% : 5.1 to 8.3) and AUC by 9-fold (CI 90% : 6.5 to 12.3)' and still names no inhibitor strength. Section 7.2: 'Mavorixafor is an inhibitor of CYP3A4.' and 'Mavorixafor is an inhibitor of P-gp.' Neither sentence names a strength, so those perpetrator roles stay ungraded. The labeled action is more frequent monitoring where minimal substrate concentration changes may lead to serious adverse reactions. Section 12.3: 'Midazolam (CYP3A4 substrate) Cmax increased by 1.1-fold (CI 90% : 1.0 to 1.3) and AUC by 1.7-fold (CI 90% : 1.4 to 2.1)' and 'Digoxin Cmax increased by 1.5-fold (CI 90% : 1.3 to 1.8) and AUC increased by 1.6-fold (CI 90% : 1.4 to 1.9),' again with no strength word. Victim side the label does act on: section 7.1, 'Mavorixafor is a CYP3A4 substrate.' Highlights: 'Strong CYP3A4 inhibitors: Reduce XOLREMDI daily dosage.' Body: 'Avoid concomitant use with a strong CYP3A4 inducer.' Highlights: 'P-gp inhibitors or moderate CYP3A4 inhibitors: Monitor more frequently for XOLREMDI adverse reactions and reduce XOLREMDI daily dosage if necessary.' CYP3A4 is a major substrate here because a strong CYP3A4 inhibitor or inducer has a labeled dosage change or an avoid instruction. 'Mavorixafor is a P-gp substrate' is cited and left ungraded: no substrate-sensitivity word. Metformin may fall — section 12.3: 'Metformin Cmax decreased by 35% (CI 90% : 17 to 49%) and AUC decreased by 35% (CI 90% : 20 to 47%)' — and section 7.2 says 'The mechanism of this interaction is unknown,' so no enzyme role is coded. Section 5.2: 'XOLREMDI causes concentration-dependent QTc interval prolongation.' Section 7.3 names torsade de pointes with other QTc-prolonging products, so this desk chips qt-known, the same move as modern rows whose labels say the drug causes concentration-dependent QTc prolongation. Patient counseling (17): avoid grapefruit ('grapefruit is a strong CYP3A4 inhibitor'), goldenseal ('it is a strong CYP3A4 inhibitor'), and St. John's wort ('it is an inducer of CYP3A4'). Section 8.7: 'XOLREMDI is not recommended for use in patients with moderate to severe hepatic impairment' because those pharmacokinetics have not been studied; that is not coded as hepatotoxicity. Section 5.1: 'XOLREMDI is expected to cause fetal harm when administered to a pregnant woman.' Educational desk only. Not a dose. Source: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=7f3a5ee3-ca73-4876-85a0-ed1e108a2237"
