          - paragraph [ref=e536]: Built for learning and clinical review — not a personal treatment guide. FirstPass 1.79.0 is an educational clinical decision-support aid for licensed healthcare professionals and supervised health-professions students. This software has not been cleared or approved by the U.S. Food and Drug Administration. Display of FDA-label text does not make FirstPass an FDA-cleared device. It can miss risks; an empty result is not proof that a combination is safe. It does not identify product contents, diagnose, or tell anyone what to start, stop, or change. For care decisions, consult a qualified clinician and current FDA-approved labeling. Street-supply entries are teaching examples, not product identification.
