            - paragraph [ref=e515]: A washout window is roughly how long a medicine, or its effect on a liver enzyme, keeps lingering after the last dose. Stopping yesterday does not always mean the interaction is gone today.
            - paragraph [ref=e516]: These are teaching estimates for independent review, not a restart date and not a real-time alert. A study aid for how timing changes the picture. Product labeling and the prescriber govern.
