        - generic [ref=f3e3119]:
          - heading "How it scores" [level=2] [ref=f3e3120]
          - list [ref=f3e3121]:
            - listitem [ref=f3e3122]: PK. Strong inhibitors of sensitive or narrow-index substrates grade contraindicated; induction of clearance is loss of efficacy.
            - listitem [ref=f3e3123]: Curve. Grey is this route, normal metabolizer, no blockers. Teal is this desk. q8h / q12h / q24h show how doses stack (build-up / Rac). Overlay IV vs oral on first-pass victims. Not a plasma level. Five-drug exposure (AUCR) stays free.
            - listitem [ref=f3e3124]: 2D6. Blockade of codeine or tamoxifen is lost activation; of DXM or MDMA it is stacked parent plus serotonin.
            - listitem [ref=f3e3125]: Phenotype. Flip CYP2D6 / 2C19 / 2C9 / 2B6 to poor or ultrarapid — a poor metabolizer scores like a strong inhibitor of that enzyme. Poor 2C9 metabolizers make warfarin and edible THC hotter.
            - listitem [ref=f3e3126]: Host. Daily smoke induces CYP1A2. Chronic alcohol induces CYP2E1 (NAPQI from acetaminophen). Oral ketamine and edible THC are first-pass victims; IV and smoked mostly skip it.
            - listitem [ref=f3e3127]: Food. Grapefruit knocks out intestinal 3A4. Tyramine plus an MAOI is a pressor crisis. Piperine and pomegranate are quieter 3A4 hits. Licorice drops potassium. Fat meals raise oral THC/CBD. Salt and urine pH move lithium and amphetamine.
            - listitem [ref=f3e3128]: Supplement. Red yeast rice is lovastatin. Berberine is a 3A4/P-gp bully plus a glucose drop. SAM-e and 5-HTP are serotonergic. Vitamin K dumps INR; nattokinase and fish oil bleed. Calcium/iron chelate Cipro and Synthroid. Charcoal and psyllium bind the morning dose. Niacin plus a statin is muscle. Search supplement / vitamin / otc.
            - listitem [ref=f3e3129]: "Street. Cocaine plus ethanol is cocaethylene. Stimulant plus opioid is a speedball — the stimulant masks apnea. Dirty 30s are pressed fentanyl ± xylazine, not oxycodone; naloxone will not reverse the α2. Percocet is oxy + APAP. HR tab: never use alone, recovery position, test-strip limits, GHB steep curve, MDMA heat/water, TripSit combo ratings, live PsychonautWiki intros with milligrams stripped. A wiki is not a label — independently review. Not a cooking guide."
            - listitem [ref=f3e3130]: MAT. Put methadone or a film on the desk, then tap today's extra on the window tray. Buprenorphine on a fentanyl load is precipitated withdrawal, not stacked milligrams. Methadone lives on 3A4/2B6 — inducers look like a stolen dose; azoles, Vistaril, and Zofran are the QT traps. Paxlovid dumps methadone and raises fentanyl; cobicistat (Tybost) is the opposite arrow on methadone. Gabapentinoids are not free extras on an opioid airway. Lofexidine is α2 — naloxone will not reverse it. Epclusa next to methadone should stay quiet; rifampin should not. The window briefing is watch / counsel / hold — copy the huddle onto a note. Not a protocol.
            - listitem [ref=f3e3131]: CYP clock. Strong / moderate / weak are FDA fold-change grades (Huang 2007 / 2020 guidance), not vibes. Mechanism-based inhibitors (clarithromycin, grapefruit, ritonavir, paroxetine, fluoxetine) destroy the enzyme — stopping yesterday does not restore it. Inducers take a week to land and two weeks to leave; the stop is rebound toxicity. Open the CYP tab. Plan the stop on the start day. Not a milligram.
            - listitem [ref=f3e3132]: Clinic. Allopurinol × azathioprine is xanthine oxidase, not CYP — pancytopenia. Nitrates × PDE5 are labeled hypotension. Omeprazole blunts clopidogrel activation (2C19 prodrug); pantoprazole is the quieter switch. Oral budesonide and swallowed fluticasone are gut 3A4 first-pass victims — azoles and ritonavir make a 'local' steroid systemic. Terbinafine is a strong 2D6 inhibitor, not an azole. Ozempic next to a sulfonylurea is hypoglycemia; next to metformin it should stay quieter. Search clinic / primary / ozempic / imuran.
            - listitem [ref=f3e3133]: Host clinic. Flip geriatric for Beers 2023. CKD scores renally cleared NTI drugs and NSAIDs. Pregnant flags ACEI/ARB, warfarin, valproate, MTX, mycophenolate. Teaching notes, not a label. Search beers / pregnant.
            - listitem [ref=f3e3134]: Sources. DrugBank accession ids (CC0 vocabulary) for lookup; target labels are FirstPass summaries. PharmGKB / CPIC is the gene table; flip a metabolizer on this desk and the matching row highlights. The receptor sketch (spectrum, occupancy, side effects from those receptors) is in original language, not a quotation of a textbook. PubMed is a curated PMID shelf plus a live NCBI search for the pair on the desk. Search pgx / stahl / drugbank / pubmed.
        - generic [ref=f3e3135]:
          - paragraph [ref=f3e3136]: About this desk
          - paragraph [ref=f3e3137]: Built for learning and clinical review — not a personal treatment guide. FirstPass 1.79.0 is an educational clinical decision-support aid for licensed healthcare professionals and supervised health-professions students. This software has not been cleared or approved by the U.S. Food and Drug Administration. Display of FDA-label text does not make FirstPass an FDA-cleared device. It can miss risks; an empty result is not proof that a combination is safe. It does not identify product contents, diagnose, or tell anyone what to start, stop, or change. For care decisions, consult a qualified clinician and current FDA-approved labeling. Street-supply entries are teaching examples, not product identification.
