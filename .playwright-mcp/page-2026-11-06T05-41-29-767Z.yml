        - generic [ref=f3e313]:
          - paragraph [ref=f3e314]: Monograph
          - heading "Vorasidenib" [level=2] [ref=f3e315]
          - paragraph [ref=f3e316]: FLT3 / IDH / hedgehog · Voranigo
          - paragraph [ref=f3e317]: "Inhibitor of IDH1 and IDH2. Section 12.3: 'Vorasidenib is primarily metabolized by CYP1A2 with minor contributions from CYP2B6, CYP2C8, CYP2C9, CYP2C19, CYP2D6 and CYP3A.' Section 7.1: 'Avoid concomitant use of VORANIGO with strong and moderate CYP1A2 inhibitors.' and 'Avoid concomitant use of VORANIGO with moderate CYP1A2 inducers and smoking tobacco.' Section 12.3: 'Concomitant use of ciprofloxacin (moderate CYP1A2 inhibitor) increased vorasidenib plasma Cmax 1.3-fold and AUC 2.5-fold.' and 'Concomitant use with fluvoxamine (strong CYP1A2 inhibitor) is predicted to increase vorasidenib Cmax and AUC by ≥5-fold.' The label does not call vorasidenib a sensitive substrate, so CYP1A2 stays major here. The perpetrator side stays ungraded. Section 12.3, in vitro: 'Vorasidenib is an inducer of CYP2B6, CYP2C8, CYP2C9, CYP2C19 and CYP3A and UGT1A4.' Section 7.2: 'Avoid concomitant use of VORANIGO with CYP3A substrates, where a minimal concentration change may lead to reduced therapeutic effect.' For hormonal contraception: 'If concomitant use cannot be avoided, use with nonhormonal contraception methods.' Neither sentence names a strength, so no ind() role is coded and this desk will not score that effect. Read them here. Section 12.3 predicts no clinically significant change in digoxin or rosuvastatin. Section 5.1: 'VORANIGO can cause hepatic transaminase elevations, which can lead to hepatic failure, hepatic necrosis, and autoimmune hepatitis.' No QT chip: section 12.2 says 'a mean increase in the QTc interval >20 msec is unlikely' at the labeled timing, and adds 'There is insufficient information to characterize the QTc effects of VORANIGO at higher vorasidenib concentrations,' so the missing chip is not a clearance. Section 5.2: fetal harm. Educational desk only. Not a dose. Source: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=31405fee-55b7-4857-987e-2724ee76be84"
          - paragraph [ref=f3e318]: Label version dated 2026-06-20. Last checked 2026-11-05.
