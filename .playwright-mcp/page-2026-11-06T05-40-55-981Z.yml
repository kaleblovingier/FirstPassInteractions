                    - paragraph [ref=f1e537]: There is no safe use — only safer use
                    - paragraph [ref=f1e538]: "PsychonautWiki: research the molecule, test the solid, do not eyeball, do not drive, do not swim, do not be responsible for someone else's body while intoxicated. Abstinence is valid. So is reducing the next harm."
                  - listitem [ref=f1e539]:
                    - paragraph [ref=f1e540]: Delayed onset punishes a redose
                    - paragraph [ref=f1e541]: Unknown supply, delayed onset (PMA, oral ketamine, edible cannabis), and steep curves (GHB, nitazenes) punish a redose. This desk still does not pick the milligram.
                  - listitem [ref=f1e542]:
                    - paragraph [ref=f1e543]: Chemically test; do not eyeball
                    - paragraph [ref=f1e544]: The fold may not be what it was sold as. Reagents name a class, not a milligram and not a hidden fentanyl. A negative is not proof of safety. DanceSafe and the wiki both say this.
                  - listitem [ref=f1e545]:
                    - paragraph [ref=f1e546]: Do not mix depressants
                    - paragraph [ref=f1e547]: "TripSit / PsychonautWiki dangerous-combinations chart: opioids + benzos + alcohol + GHB is how people stop breathing. Effects are multiplicative. A stimulant on top hides it until the stimulant leaves."
                  - listitem [ref=f1e548]:
                    - paragraph [ref=f1e549]: Do not drive. Do not swim.
                    - paragraph [ref=f1e550]: PsychonautWiki names both. Impaired machinery and drownings are unromantic deaths. Do not be the person responsible for children, patients, or a car while intoxicated.
                  - listitem [ref=f1e551]:
                    - paragraph [ref=f1e552]: Set, setting, sitter
                    - paragraph [ref=f1e553]: Hallucinogens amplify the room the person is already in. A positive mindset gets louder; a bad one does too. Familiar indoor room, no one to be responsible for, a sober sitter, an exit that is not more drug.
                  - listitem [ref=f1e554]:
                    - paragraph [ref=f1e555]: A sitter for the unfamiliar
                    - paragraph [ref=f1e556]: Someone sober enough to call 911, put them on their side, and stay. Never Use Alone is a phone that stays on the line. This desk is not a sitter.
                  - listitem [ref=f1e557]:
                    - paragraph [ref=f1e558]: Use should not eat the rest of a life
                    - paragraph [ref=f1e559]: "The wiki's least glamorous rule: if the molecule is crowding out work, people, or sleep, that is harm. Treatment referral is SAMHSA 1-800-662-HELP. Independently review."
